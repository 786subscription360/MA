<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Next-Shift Token Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* Modern Smart Dashboard Styling */
        body { 
            background: #f1f5f9; 
            min-height: 100vh;
            padding: 15px 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        
        .controls {
            max-width: 1000px; /* Reduced width for a tighter look */
            margin: 0 auto 20px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }

        /* Modernized Header */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 15px;
            padding-bottom: 12px;
        }

        .dashboard-info h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-info h1 i::before { content: "\F4D7"; font-family: "bootstrap-icons"; color: #4f46e5; }

        .meta-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag-pill {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tag-blue { background: #eff6ff; color: #1d4ed8; border: 1px solid #dbeafe; }
        .tag-gray { background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; }
        .tag-green { background: #ecfdf5; color: #059669; border: 1px solid #d1fae5; }

        .btn-action-group {
            display: flex;
            gap: 8px;
        }

        .btn-print-smart {
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-print-smart:hover {
            background: #4338ca;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .btn-reset {
            background: #f8fafc;
            color: #94a3b8;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 10px;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: #fff1f1;
            color: #ef4444;
            border-color: #fee2e2;
        }

        /* Compact Modern Inputs */
        .input-wrapper {
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 4px 10px;
            transition: all 0.2s;
            height: 48px; /* Fixed height for symmetry */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .input-wrapper:focus-within {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
        }

        .smart-label {
            font-size: 0.90rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 0px;
        }

        .smart-input {
            border: none;
            outline: none;
            width: 100%;
            font-weight: 600;
            color: #334155;
            background: transparent;
            font-size: 0.85rem;
            padding: 0;
            margin: 0;
        }

        /* --- TOKEN UI --- */
        .a4-page {
            width: 210mm; height: 297mm; background: white; margin: 20px auto; 
            padding: 12mm 10mm; box-sizing: border-box; box-shadow: 0 0 20px rgba(0,0,0,0.2);
            page-break-after: always; overflow: hidden;
        }
        .token-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(5, 1fr); gap: 6mm; height: 100%;
        }
        .token {
            border: 2px dashed #000; border-radius: 8px; padding: 12px 18px;
            display: flex; flex-direction: column; justify-content: space-around; 
            background: #fff;
            background-image: 
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='60'><text x='10' y='40' fill='rgba(0,0,0,0.08)' font-family='Arial' font-weight='900' font-size='12' transform='rotate(-25 50 30)'>ORIGINAL</text></svg>"),
                radial-gradient(#f0f0f0 1px, transparent 1px);
            background-size: 80px 50px, 10px 10px;
            height: 50mm; box-sizing: border-box; position: relative; overflow: hidden; 
        }
        .header {
            text-align: center; font-weight: 900; font-size: 13.5pt; 
            text-decoration: underline; text-transform: uppercase;
            margin-bottom: 5px; color: #000; position: relative; z-index: 1;
            letter-spacing: -0.2px;
        }
        .token-body { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
        .fields-container { flex: 1; margin-right: 12px; }
        .field {
            display: flex; justify-content: space-between; border-bottom: 1.5px solid #000;
            padding-bottom: 3px; font-family: 'Arial Narrow', sans-serif; 
            font-size: 10pt; margin-bottom: 6px; background: rgba(255,255,255,0.85); 
        }
        .label { font-weight: 700; font-size: 10.5pt; text-transform: uppercase; letter-spacing: 0.3px; }
        .value { font-weight: 900; font-size: 15pt; color: #000; white-space: pre; } 
        .qr-code-box { width: 70px; height: 70px; background: white; padding: 2px; border: 1.5px solid #000; }

        @media print {
            @page { size: A4; margin: 0; }
            .no-print { display: none !important; }
            body { background: white; padding: 0; margin: 0; }
            .a4-page { margin: 0; box-shadow: none; border: none; }
        }
    </style>
</head>
<body>

<div class="container no-print">
    <div class="controls">
        <div class="header-section">
            <div class="dashboard-info">
                <h1> Mobile Token </h1>
                <div class="meta-tags">
                    <span id="predictionText" class="tag-pill tag-blue"></span>
                    <span class="tag-pill tag-gray"><i class="bi bi-file-earmark-pdf"></i> <span id="pageCounter">1</span> Page(s)</span>
                    <span class="tag-pill tag-green"><i class="bi bi-arrow-repeat"></i> Last: <span id="lastGenTime">Never</span></span>
                    <span class="tag-pill tag-gray"><i class="bi bi-hash"></i> Range: <span id="rangeDisplay">---</span></span>
                </div>
            </div>
            <div class="btn-action-group">
                <button class="btn-reset" onclick="resetForm()" title="Reset to defaults">
                    <i class="bi bi-arrow-counterclockwise"></i>
                </button>
                <button class="btn-print-smart" onclick="handlePrint()">
                    <i class="bi bi-printer-fill"></i> GENERATE & PRINT
                </button>
            </div>
        </div>
        
        <div class="row gx-2 gy-2"> 
            <div class="col-md-2">
                <div class="input-wrapper">
                    <label class="smart-label">Mode</label>
                    <select id="genMode" class="smart-input" onchange="toggleMode(); draw();">
                        <option value="auto">Auto Mode</option>
                        <option value="manual">Manual Mode</option>
                    </select>
                </div>
            </div>
            <div class="col-md-2">
                <div class="input-wrapper" id="shiftWrapper">
                    <label class="smart-label">Shift</label>
                    <select id="tokenType" class="smart-input" onchange="draw()">
                        <option value="M">Morning (M)</option>
                        <option value="E">Evening (E)</option>
                        <option value="N">Night (N)</option>
                    </select>
                </div>
            </div>
            <div class="col-md-1">
                <div class="input-wrapper">
                    <label class="smart-label">From</label>
                    <input type="number" id="tokenStart" class="smart-input" value="1" oninput="draw()">
                </div>
            </div>
            <div class="col-md-1">
                <div class="input-wrapper">
                    <label class="smart-label">To</label>
                    <input type="number" id="tokenEnd" class="smart-input" value="10" oninput="draw()">
                </div>
            </div>
            <div class="col-md-2">
                <div class="input-wrapper">
                    <label class="smart-label">Emp Code</label>
                    <input type="text" id="empCode" class="smart-input" placeholder="5042" oninput="draw()">
                </div>
            </div>
            <div class="col-md-3">
                <div class="input-wrapper" id="dateWrapper">
                    <label class="smart-label">Date</label>
                    <input type="date" id="datePicker" class="smart-input" onchange="draw()">
                </div>
            </div>
            <div class="col-md-1 d-flex align-items-center justify-content-center">
                <div class="form-check form-switch" title="Toggle QR Codes">
                    <input class="form-check-input" type="checkbox" id="showQR" checked onchange="draw()" style="width: 2.2em; height: 1.1em; cursor: pointer;">
                </div>
            </div>
        </div>
    </div>
</div>

<div id="pages-container"></div>

<script>
    /* Utility Logic */
    function updateLastGenTime() {
        const now = new Date();
        document.getElementById('lastGenTime').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
    }

    function toggleMode() {
        const mode = document.getElementById('genMode').value;
        const shiftWrap = document.getElementById('shiftWrapper');
        const dateWrap = document.getElementById('dateWrapper');
        
        if (mode === 'manual') {
            shiftWrap.style.opacity = '0.4';
            shiftWrap.style.pointerEvents = 'none';
            dateWrap.style.opacity = '0.4';
            dateWrap.style.pointerEvents = 'none';
        } else {
            shiftWrap.style.opacity = '1';
            shiftWrap.style.pointerEvents = 'auto';
            dateWrap.style.opacity = '1';
            dateWrap.style.pointerEvents = 'auto';
        }
    }

    function resetForm() {
        document.getElementById('genMode').value = 'auto';
        document.getElementById('empCode').value = '';
        document.getElementById('tokenStart').value = '1';
        document.getElementById('tokenEnd').value = '10';
        document.getElementById('datePicker').valueAsDate = new Date();
        toggleMode();
        draw();
    }

    function handlePrint() {
        updateLastGenTime();
        window.print();
    }

    /* LOGIC REMAINS COMPLETELY UNCHANGED */
    function getNextShift() {
        const now = new Date();
        const hour = now.getHours();
        let prediction = "";
        let selectedShift = "M";

        if (hour >= 3 && hour < 11) {
            selectedShift = "M"; 
            prediction = "Current: Morning Shift";
        } else if (hour >= 11 && hour < 18) {
            selectedShift = "E"; 
            prediction = "Current: Evening Shift";
        } else {
            selectedShift = "N"; 
            prediction = "Current: Night Shift";
        }

        document.getElementById('tokenType').value = selectedShift;
        document.getElementById('predictionText').innerHTML = `<i class="bi bi-clock-history"></i> ${prediction}`;
    }

    function formatDate(dateStr) {
        if(!dateStr) return "N/A";
        const date = new Date(dateStr);
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${String(date.getDate()).padStart(2, '0')}-${months[date.getMonth()]}-${date.getFullYear()}`;
    }

    function draw() {
        const start = parseInt(document.getElementById('tokenStart').value) || 1;
        const end = parseInt(document.getElementById('tokenEnd').value) || 1;
        const code = document.getElementById('empCode').value || "00";
        const type = document.getElementById('tokenType').value;
        const rawDate = document.getElementById('datePicker').value;
        const showQR = document.getElementById('showQR').checked;
        const mode = document.getElementById('genMode').value;
        
        let formattedDate = formatDate(rawDate);
        let shiftSuffix = `-${type}`;
        
        // Handle Manual Mode logic
        if (mode === 'manual') {
            formattedDate = ""; // Blank date
            shiftSuffix = " -   "; // Trailing blank space for M/E/N writing
        }
        
        const container = document.getElementById('pages-container');
        const total = (end - start) + 1;

        document.getElementById('pageCounter').innerText = Math.ceil(total / 5) || 0;
        document.getElementById('rangeDisplay').innerText = `${start.toString().padStart(3,'0')}${shiftSuffix} to ${end.toString().padStart(3,'0')}${shiftSuffix}`;

        if (total > 500) return;
        container.innerHTML = ''; 

        let current = start;
        const rowsPerPage = 5; 
        const totalPages = Math.ceil(total / rowsPerPage);

        for (let p = 0; p < totalPages; p++) {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'a4-page';
            const gridDiv = document.createElement('div');
            gridDiv.className = 'token-grid';
            
            for (let i = 0; i < rowsPerPage; i++) {
                if (current > end) break;
                const tStr = `${current.toString().padStart(3, '0')}${shiftSuffix}`;

                for(let copy = 0; copy < 2; copy++) {
                    const tDiv = document.createElement('div');
                    tDiv.className = 'token';
                    tDiv.innerHTML = `
                        <div class="header">Mobile Submission Receipt</div>
                        <div class="token-body">
                            <div class="fields-container">
                                <div class="field"><span class="label">TOKEN NO:</span><span class="value">${tStr}</span></div>
                                <div class="field"><span class="label">EMP CODE:</span><span class="value">${code}</span></div>
                                <div class="field"><span class="label">DATE:</span><span class="value">${formattedDate}</span></div>
                            </div>
                            ${showQR ? `<div class="qr-code-box" id="qr-${current}-${copy}"></div>` : ''}
                        </div>`;
                    gridDiv.appendChild(tDiv);
                }
                current++;
            }
            pageDiv.appendChild(gridDiv);
            container.appendChild(pageDiv);
        }

        if (showQR) {
            current = start;
            for (let p = 0; p < totalPages; p++) {
                for (let i = 0; i < rowsPerPage; i++) {
                    if (current > end) break;
                    
                    const tStr = `${current.toString().padStart(3, '0')}${shiftSuffix}`;
                    const qrData = `TOKEN: ${tStr}\nEMP: ${code}\nDATE: ${formattedDate}`;
                    
                    for(let c = 0; c < 2; c++) {
                        const qrElem = document.getElementById(`qr-${current}-${c}`);
                        if(qrElem) {
                            new QRCode(qrElem, {
                                text: qrData, width: 70, height: 70
                            });
                        }
                    }
                    current++;
                }
            }
        }
    }

    document.getElementById('datePicker').valueAsDate = new Date();
    getNextShift();
    toggleMode(); // Initialize visibility states
    draw();
</script>
</body>
</html>

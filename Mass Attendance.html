<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Reporter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #25d366;
            --primary-dark: #1da851;
            --dark-bg: #0f172a;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --accent: #6366f1;
            --mono: 'JetBrains Mono', monospace;
        }

        body {
            background-color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            padding-bottom: 15px;
            overflow-x: hidden;
        }

        h2, .display-font { font-family: 'Space Grotesk', sans-serif; }

        .header-section {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 18px 0 35px 0;
            color: white;
            text-align: center;
            margin-bottom: -22px;
            position: relative;
        }

        .header-section h2 { font-weight: 700; letter-spacing: -0.5px; font-size: 1.6rem; margin-bottom: 2px; }
        .header-section p { font-size: 0.82rem; letter-spacing: 0.3px; margin-bottom: 0; }

        .history-toggle {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: white;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 0.78rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .history-toggle:hover { background: rgba(255, 255, 255, 0.16); color: white; }

        .history-count {
            background: var(--primary);
            color: #0f172a;
            font-weight: 800;
            font-size: 0.7rem;
            padding: 1px 6px;
            border-radius: 20px;
            min-width: 18px;
            text-align: center;
        }

        .container-box { max-width: 960px; margin: 0 auto; padding: 0 12px; }

        .main-card {
            background: var(--card-bg);
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -5px rgba(0, 0, 0, 0.03);
            overflow: hidden;
        }

        .input-section { padding: 22px; border-right: 1px solid #f1f5f9; }
        .preview-section { padding: 22px; background-color: #fdfdfd; }

        .section-title {
            font-weight: 700;
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #64748b;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
            margin-left: 12px;
        }

        .form-label { font-weight: 600; font-size: 0.78rem; color: #475569; margin-bottom: 4px; }

        .form-control, .form-select {
            border: 2px solid #f1f5f9;
            border-radius: 10px;
            padding: 8px 12px;
            font-weight: 500;
            font-size: 0.88rem;
            transition: all 0.2s;
            background-color: #f8fafc;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            background-color: white;
        }

        .auto-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
            padding: 2px 7px;
            border-radius: 20px;
            margin-left: 6px;
            vertical-align: middle;
            text-transform: uppercase;
        }

        .total-badge {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border-radius: 14px;
            padding: 12px 16px;
            text-align: center;
            margin-top: 14px;
        }
        .total-label { font-size: 0.7rem; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; display: block; }
        .total-value { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 700; display: block; line-height: 1.1; }

        .whatsapp-container {
            background: #e5ddd5;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            padding: 12px;
            border-radius: 12px;
            position: relative;
            max-height: 250px;
            display: flex;
            flex-direction: column;
        }

        .preview-box {
            background: white;
            color: #111b21;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            white-space: pre-wrap;
            line-height: 1.45;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: relative;
            max-height: 220px;
            overflow-y: auto;
        }

        .preview-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: -8px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 8px 8px 0;
            border-color: transparent white transparent transparent;
        }

        .btn-whatsapp, .btn-email, .btn-copy {
            border-radius: 10px;
            padding: 9px 12px;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .btn-whatsapp {
            background-color: var(--primary);
            color: white;
            border: none;
            box-shadow: 0 3px 10px rgba(37, 211, 102, 0.3);
        }
        .btn-whatsapp:hover { background-color: var(--primary-dark); transform: translateY(-1px); color: white; }

        .btn-email {
            background-color: var(--accent);
            color: white;
            border: none;
            box-shadow: 0 3px 10px rgba(99, 102, 241, 0.3);
        }
        .btn-email:hover { background-color: #4f46e5; transform: translateY(-1px); color: white; }

        .btn-copy {
            border: 2px solid #e2e8f0;
            background: white;
            color: #64748b;
            font-weight: 600;
        }
        .btn-copy:hover { background: #f8fafc; border-color: #cbd5e1; }

        /* ---- History modal ---- */
        .history-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            z-index: 1000;
            align-items: flex-start;
            justify-content: center;
            padding: 5vh 15px;
            overflow-y: auto;
        }

        .history-backdrop.show { display: flex; }

        .history-panel {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            overflow: hidden;
        }

        .history-header {
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f1f5f9;
        }

        .history-header h5 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            margin: 0;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-header-actions { display: flex; align-items: center; gap: 8px; }

        .btn-clear-history {
            background: #fef2f2;
            color: #dc2626;
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-clear-history:hover { background: #fee2e2; color: #b91c1c; }

        .btn-close-history {
            background: #f1f5f9;
            color: #64748b;
            border: none;
            border-radius: 8px;
            width: 30px;
            height: 30px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-close-history:hover { background: #e2e8f0; }

        .history-body {
            padding: 8px 12px 16px 12px;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .history-empty {
            text-align: center;
            color: #94a3b8;
            padding: 40px 20px;
            font-weight: 500;
            font-size: 0.88rem;
        }
        .history-empty .icon { font-size: 2rem; display: block; margin-bottom: 8px; color: #cbd5e1; }

        .history-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 10px;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .history-item:hover { background: #f8fafc; }
        .history-item:hover .history-copy-btn { opacity: 1; }
        .history-item + .history-item { border-top: 1px solid #f1f5f9; }

        .history-copy-btn {
            border: none;
            background: #f1f5f9;
            color: #64748b;
            border-radius: 8px;
            width: 28px;
            height: 28px;
            min-width: 28px;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.55;
            transition: all 0.15s;
        }
        .history-copy-btn:hover { background: #e2e8f0; opacity: 1 !important; }
        .history-copy-btn.copied { background: rgba(37, 211, 102, 0.15); color: var(--primary-dark); opacity: 1 !important; }

        .history-icon {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .history-icon.whatsapp { background: rgba(37, 211, 102, 0.12); color: var(--primary-dark); }
        .history-icon.email { background: rgba(99, 102, 241, 0.12); color: var(--accent); }
        .history-icon.copy { background: rgba(100, 116, 139, 0.12); color: #64748b; }

        .history-main { flex: 1; min-width: 0; }

        .history-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 2px;
        }

        .history-title { font-weight: 700; font-size: 0.86rem; color: #1e293b; }
        .history-time { font-size: 0.7rem; color: #94a3b8; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 3px; }

        .history-meta {
            font-size: 0.76rem;
            color: #64748b;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
        }

        .shift-chip {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .shift-chip.morning { background: #fef3c7; color: #92400e; }
        .shift-chip.evening { background: #ede9fe; color: #5b21b6; }
        .shift-chip.night   { background: #e0e7ff; color: #1e3a8a; }

        .history-total {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: #4f46e5;
        }

        @media (max-width: 768px) {
            .input-section { border-right: none; border-bottom: 1px solid #f1f5f9; }
            .header-section { padding: 15px 0 25px 0; }
            .history-toggle { position: static; margin-top: 10px; }
        }
    </style>
</head>
<body>

<div class="header-section">
    <div class="container">
        <button class="history-toggle" onclick="openHistory()">
            <i class="bi bi-clock-history"></i> History <span class="history-count" id="historyCount">0</span>
        </button>
        <h2 class="display-font">Attendance Reporter</h2>
        <p class="opacity-75">Generate &amp; send shift reports instantly</p>
    </div>
</div>

<div class="container container-box">
    <div class="main-card card">
        <div class="row g-0">
            <div class="col-md-6 input-section">
                <div class="section-title"><i class="bi bi-sliders me-2"></i>Log Details</div>

                <div class="row g-2">
                    <div class="col-12">
                        <label class="form-label"><i class="bi bi-calendar-event me-1 text-muted"></i> Report Date</label>
                        <input type="date" id="date" class="form-control" onchange="updatePreview()">
                    </div>

                    <div class="col-6">
                        <label class="form-label"><i class="bi bi-clock me-1 text-muted"></i> Shift <span id="autoBadge" class="auto-badge" style="display:none;"><i class="bi bi-lightning-charge-fill"></i> Auto</span></label>
                        <select id="shift" class="form-select" onchange="onShiftManualChange()">
                            <option>Morning</option>
                            <option selected>Evening</option>
                            <option>Night</option>
                        </select>
                    </div>

                    <div class="col-6">
                        <label class="form-label"><i class="bi bi-geo-alt me-1 text-muted"></i> Location</label>
                        <select id="location" class="form-select" onchange="updatePreview()">
                            <option selected>Sheikhupura</option>
                            <option>Lahore</option>
                            <option>Karachi</option>
                            <option>Islamabad</option>
                        </select>
                    </div>

                    <div class="col-6">
                        <label class="form-label"><i class="bi bi-person-badge me-1 text-muted"></i> Permanent Staff</label>
                        <input type="number" id="permanent" class="form-control" value="66" oninput="updateTotal()">
                    </div>

                    <div class="col-6">
                        <label class="form-label"><i class="bi bi-people me-1 text-muted"></i> HSRG Staff</label>
                        <input type="number" id="hsrg" class="form-control" value="60" oninput="updateTotal()">
                    </div>
                </div>

                <div class="total-badge">
                    <span class="total-label"><i class="bi bi-pie-chart-fill me-1"></i> Combined Headcount</span>
                    <span class="total-value" id="total">126</span>
                </div>
            </div>

            <div class="col-md-6 preview-section">
                <div class="section-title"><i class="bi bi-eye me-2"></i>Message Preview</div>

                <div class="whatsapp-container mb-3">
                    <div class="preview-box" id="preview"></div>
                </div>

                <div class="d-grid gap-2">
                    <button class="btn btn-whatsapp" onclick="sendToWhatsApp()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-whatsapp me-2" viewBox="0 0 16 16">
                            <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93a7.898 7.898 0 0 0-2.327-5.594l.004-.005zm-5.607 11.326a6.59 6.59 0 0 1-3.333-.908l-.239-.142-2.481.651.662-2.422-.156-.248a6.579 6.579 0 0 1-1.003-3.533c0-3.627 2.958-6.585 6.59-6.585a6.55 6.55 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                        </svg> Send to WhatsApp
                    </button>
                    <button class="btn btn-email" onclick="sendToEmail()">
                        <i class="bi bi-envelope-fill me-2"></i> Send by Email
                    </button>
                    <button class="btn btn-copy" onclick="copyData()">
                        <i class="bi bi-clipboard-fill me-2"></i> Copy Text
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- History Modal -->
<div class="history-backdrop" id="historyBackdrop" onclick="closeHistoryOnBackdrop(event)">
    <div class="history-panel">
        <div class="history-header">
            <h5><i class="bi bi-journal-bookmark-fill text-indigo"></i> Report History</h5>
            <div class="history-header-actions">
                <button class="btn-clear-history" onclick="clearHistory()"><i class="bi bi-trash3-fill"></i> Clear All</button>
                <button class="btn-close-history" onclick="closeHistory()"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>
        <div class="history-body" id="historyBody">
            <!-- populated by JS -->
        </div>
    </div>
</div>

<script>
    // Updated auto shift time windows (Morning: 07:00 to 11:00, Evening: 02:30 PM to 07:00 PM, Night: 10:00 PM to 01:00 AM)
    const SHIFT_WINDOWS = {
        Morning: [[7 * 60, 11 * 60]],
        Evening: [[14 * 60 + 30, 19 * 60]],
        Night:   [[22 * 60, 24 * 60], [0, 1 * 60]] // wraps past midnight
    };

    function detectShiftFromTime(date = new Date()) {
        const minutes = date.getHours() * 60 + date.getMinutes();
        for (const [shift, windows] of Object.entries(SHIFT_WINDOWS)) {
            for (const [start, end] of windows) {
                if (minutes >= start && minutes < end) return shift;
            }
        }
        return null;
    }

    let shiftIsAuto = true;

    function onShiftManualChange() {
        shiftIsAuto = false;
        document.getElementById('autoBadge').style.display = 'none';
        updatePreview();
    }

    function applyAutoShift() {
        const detected = detectShiftFromTime();
        const badge = document.getElementById('autoBadge');
        if (detected) {
            document.getElementById('shift').value = detected;
            badge.style.display = 'inline-flex';
        } else {
            badge.style.display = 'none';
        }
    }

    const dateInput = document.getElementById("date");
    dateInput.valueAsDate = new Date();

    function loadSavedReport() {
        try {
            const raw = localStorage.getItem('lastReport');
            if (raw) {
                const savedData = JSON.parse(raw);
                document.getElementById("location").value = savedData.location || 'Sheikhupura';
                document.getElementById("permanent").value = savedData.permanent ?? 66;
                document.getElementById("hsrg").value = savedData.hsrg ?? 60;
                if (savedData.shiftIsAuto === false && savedData.shift) {
                    document.getElementById("shift").value = savedData.shift;
                    shiftIsAuto = false;
                }
            }
        } catch (e) {}

        if (shiftIsAuto) applyAutoShift();
        updateTotal();
        refreshHistoryCount();
    }

    function saveToMemory() {
        const reportData = {
            shift: document.getElementById("shift").value,
            shiftIsAuto: shiftIsAuto,
            location: document.getElementById("location").value,
            permanent: document.getElementById("permanent").value,
            hsrg: document.getElementById("hsrg").value
        };
        try {
            localStorage.setItem('lastReport', JSON.stringify(reportData));
        } catch (e) {}
    }

    window.onload = loadSavedReport;

    function updateTotal() {
        let p = parseInt(document.getElementById("permanent").value) || 0;
        let h = parseInt(document.getElementById("hsrg").value) || 0;
        document.getElementById("total").innerText = p + h;
        updatePreview();
    }

    function toBoldUnicode(str) {
        const upperStart = 0x1D400, lowerStart = 0x1D41A, digitStart = 0x1D7CE;
        return str.split('').map(ch => {
            const code = ch.charCodeAt(0);
            if (code >= 65 && code <= 90) return String.fromCodePoint(upperStart + (code - 65));
            if (code >= 97 && code <= 122) return String.fromCodePoint(lowerStart + (code - 97));
            if (code >= 48 && code <= 57) return String.fromCodePoint(digitStart + (code - 48));
            return ch;
        }).join('');
    }

    function getReportData() {
        let rawDate = document.getElementById("date").value;
        let shift = document.getElementById("shift").value;
        let location = document.getElementById("location").value;
        let permanent = parseInt(document.getElementById("permanent").value) || 0;
        let hsrg = parseInt(document.getElementById("hsrg").value) || 0;
        let total = permanent + hsrg;

        let dateObj = rawDate ? new Date(rawDate) : new Date();
        let day = String(dateObj.getDate()).padStart(2, '0');
        let month = dateObj.toLocaleDateString('en-GB', { month: 'short' });
        let year = dateObj.getFullYear();
        let formattedDate = `${day}-${month}-${year}`;

        return { formattedDate, shift, location, permanent, hsrg, total };
    }

    const SHIFT_ICON = { Morning: '☀️', Evening: '🌆', Night: '🌙' };

    function buildWhatsAppText(d) {
        return `📊 *SHIFT WISE ATTENDANCE*

📅 *Date :* ${d.formattedDate}
${SHIFT_ICON[d.shift] || '⏰'} *Shift :* ${d.shift}
📍 *Location :* ${d.location}

---------------------------
👨‍💼 Permanent Staff : ${d.permanent}
👷 HSRG             : ${d.hsrg}
---------------------------
✅ Total Attendance : *${d.total}*`;
    }

    function buildEmailText(d) {
        const pad = (label, val) => `${label.padEnd(18, ' ')}: ${String(val).padStart(4, ' ')}`;
        return `${toBoldUnicode('SHIFT WISE ATTENDANCE')}
------------------------------------

Date       : ${d.formattedDate}
Shift      : ${d.shift}
Location   : ${d.location}

${toBoldUnicode('Staff Breakdown')}
------------------------------------
${pad('Permanent Staff', d.permanent)}
${pad('HSRG Staff', d.hsrg)}
------------------------------------
${pad('Total Attendance', d.total)}

${toBoldUnicode('Total Attendance: ' + d.total)}

Sent via Attendance Reporter`;
    }

    function updatePreview() {
        const d = getReportData();
        document.getElementById("preview").innerText = buildWhatsAppText(d);
        saveToMemory();
    }

    function sendToWhatsApp() {
        const d = getReportData();
        let text = buildWhatsAppText(d);
        let url = "https://wa.me/?text=" + encodeURIComponent(text);
        window.open(url, '_blank');
        logHistoryEntry('whatsapp', d);
    }

    function sendToEmail() {
        const d = getReportData();
        let subject = `Shift Attendance Report – ${d.formattedDate} (${d.shift})`;
        let body = buildEmailText(d);
        let url = "mailto:?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
        window.location.href = url;
        logHistoryEntry('email', d);
    }

    function copyData() {
        const d = getReportData();
        let text = buildWhatsAppText(d);
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.btn-copy');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="bi bi-check2-circle me-2"></i> Copied & Saved!`;
            btn.style.borderColor = "#25d366";

            saveToMemory();
            logHistoryEntry('copy', d);

            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.borderColor = "#e2e8f0";
            }, 2000);
        });
    }

    // ---- History log: localStorage with strict maximum 90 records (FIFO) ----
    const HISTORY_KEY = 'reportHistory';
    const HISTORY_LIMIT = 90;

    const HISTORY_LABEL = { whatsapp: 'Sent via WhatsApp', email: 'Sent via Email', copy: 'Copied to clipboard' };
    const HISTORY_ICON = { 
        whatsapp: '<i class="bi bi-whatsapp"></i>', 
        email: '<i class="bi bi-envelope-fill"></i>', 
        copy: '<i class="bi bi-clipboard-check-fill"></i>' 
    };

    function getHistory() {
        try {
            const raw = localStorage.getItem(HISTORY_KEY);
            if (raw) return JSON.parse(raw);
        } catch (e) {}
        return [];
    }

    function saveHistory(entries) {
        try {
            const limitedEntries = entries.slice(0, HISTORY_LIMIT);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(limitedEntries));
        } catch (e) {}
    }

    function logHistoryEntry(action, d) {
        let entries = getHistory();

        entries = entries.filter(e => !(e.formattedDate === d.formattedDate && e.shift === d.shift));

        entries.unshift({
            id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
            action,
            timestamp: new Date().toISOString(),
            ...d
        });

        saveHistory(entries);
        refreshHistoryCount(entries.length);
    }

    function refreshHistoryCount(knownLength = null) {
        const count = knownLength !== null ? knownLength : getHistory().length;
        document.getElementById('historyCount').innerText = count;
    }

    function formatHistoryTime(isoString) {
        const date = new Date(isoString);
        const now = new Date();
        const isToday = date.toDateString() === now.toDateString();
        const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
        const isYesterday = date.toDateString() === yesterday.toDateString();

        const timePart = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        if (isToday) return `Today, ${timePart}`;
        if (isYesterday) return `Yesterday, ${timePart}`;
        return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + `, ${timePart}`;
    }

    function renderHistory() {
        const entries = getHistory();
        const body = document.getElementById('historyBody');
        refreshHistoryCount(entries.length);

        if (entries.length === 0) {
            body.innerHTML = `
                <div class="history-empty">
                    <i class="bi bi-inbox icon"></i>
                    No reports saved yet.<br>Your sent &amp; copied reports will show up here.
                </div>`;
            return;
        }

        body.innerHTML = entries.map(e => {
            const shiftClass = (e.shift || '').toLowerCase();
            return `
                <div class="history-item">
                    <div class="history-icon ${e.action}">${HISTORY_ICON[e.action] || '<i class="bi bi-file-text-fill"></i>'}</div>
                    <div class="history-main">
                        <div class="history-top-row">
                            <span class="history-title">${HISTORY_LABEL[e.action] || 'Report generated'}</span>
                            <span class="history-time"><i class="bi bi-clock text-muted"></i> ${formatHistoryTime(e.timestamp)}</span>
                        </div>
                        <div class="history-meta">
                            <span class="shift-chip ${shiftClass}">${e.shift}</span>
                            <span><i class="bi bi-geo-alt"></i> ${e.location}</span>
                            <span>·</span>
                            <span><i class="bi bi-calendar3"></i> ${e.formattedDate}</span>
                            <span>·</span>
                            <span class="history-total"><i class="bi bi-people-fill"></i> ${e.total} staff</span>
                        </div>
                    </div>
                    <button class="history-copy-btn" title="Copy this report" onclick="copyHistoryEntry('${e.id}', this)"><i class="bi bi-clipboard"></i></button>
                </div>`;
        }).join('');
    }

    function copyHistoryEntry(id, btn) {
        const entries = getHistory();
        const entry = entries.find(e => e.id === id);
        if (!entry) return;
        const text = buildWhatsAppText(entry);
        navigator.clipboard.writeText(text).then(() => {
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="bi bi-check-lg"></i>';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerHTML = original;
                btn.classList.remove('copied');
            }, 1500);
        });
    }

    function openHistory() {
        document.getElementById('historyBackdrop').classList.add('show');
        renderHistory();
    }

    function closeHistory() {
        document.getElementById('historyBackdrop').classList.remove('show');
    }

    function closeHistoryOnBackdrop(evt) {
        if (evt.target.id === 'historyBackdrop') closeHistory();
    }

    function clearHistory() {
        saveHistory([]);
        renderHistory();
    }
</script>

</body>
</html>
